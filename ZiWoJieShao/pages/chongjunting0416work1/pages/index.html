<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>种俊廷 - 个人介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a202c, #2d3748);
            color: #f7fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #4299e1;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .gender {
            font-size: 16px;
            color: #a0aec0;
            margin-bottom: 24px;
        }
        .desc {
            font-size: 17px;
            line-height: 1.8;
            color: #e2e8f0;
            margin-bottom: 30px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .tag {
            background-color: rgba(66, 153, 225, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            color: #90cdf4;
        }
        .footer {
            margin-top: 32px;
            font-size: 14px;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">种</div>
        <h1>种俊廷</h1>
        <div class="gender">男</div>
        <div class="desc">
            热爱学习，乐于探索新技术。
            保持积极向上的心态，不断提升自我。
        </div>
        <div class="tags">
            <span class="tag">前端开发</span>
            <span class="tag">编程学习</span>
            <span class="tag">热爱生活</span>
        </div>
        <div class="footer">Personal Introduction Page</div>
    </div>
</body>
</html>
